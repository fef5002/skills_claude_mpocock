name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update release branch or tags
        run: |
          npm run version

          if ! git diff --quiet; then
            git checkout -B changeset-release/main
            git add .
            git commit -m "chore: version skills"
            git push origin HEAD:changeset-release/main --force
            echo "Updated changeset-release/main. Open or update the release PR manually."
            exit 0
          fi

          release_tag="$(node -p 'const pkg = require("./package.json"); pkg.name + "@" + pkg.version')"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release tag ${release_tag} already exists. Nothing to do."
            exit 0
          fi

          npx changeset tag
          git push origin --tags
