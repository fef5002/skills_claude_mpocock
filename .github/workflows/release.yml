name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update release branch or tags
        run: |
          npm run version

          if ! git diff --quiet; then
            release_patch=/tmp/changeset-release.patch
            git diff --binary > "${release_patch}"

            if git fetch origin changeset-release/main:refs/remotes/origin/changeset-release/main 2>/dev/null; then
              release_branch_sha="$(git rev-parse refs/remotes/origin/changeset-release/main)"
              git checkout -B changeset-release/main refs/remotes/origin/changeset-release/main
              git reset --hard "${GITHUB_SHA}"
            else
              release_branch_sha=""
              git checkout -B changeset-release/main
            fi

            git apply --index "${release_patch}"
            git commit -m "chore: version skills"

            if [ -n "${release_branch_sha}" ]; then
              git push origin HEAD:changeset-release/main --force-with-lease=changeset-release/main:"${release_branch_sha}"
            else
              git push origin HEAD:changeset-release/main --force-with-lease
            fi

            echo "Updated changeset-release/main. Open or update the release PR manually."
            exit 0
          fi

          release_packages="$(node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ignoredDirectories = new Set([".git", ".changeset", "node_modules"]);
          const packages = [];

          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (ignoredDirectories.has(entry.name)) {
                continue;
              }

              const entryPath = path.join(directory, entry.name);

              if (entry.isDirectory()) {
                walk(entryPath);
                continue;
              }

              if (entry.name !== "package.json") {
                continue;
              }

              const pkg = JSON.parse(fs.readFileSync(entryPath, "utf8"));

              if (pkg.name && pkg.version) {
                packages.push([
                  `${pkg.name}@${pkg.version}`,
                  path.relative(process.cwd(), entryPath),
                  pkg.version,
                ].join("\t"));
              }
            }
          }

          walk(process.cwd());
          console.log(packages.join("\n"));
          NODE
          )"

          missing_release_tags=0
          missing_release_tag_args=()
          missing_release_tag_targets=()
          while IFS=$'\t' read -r release_tag package_json_path package_version; do
            if [ -z "${release_tag}" ]; then
              continue
            fi

            if ! git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              release_commit="$(git log -G "\"version\": \"${package_version}\"" -n 1 --format=%H -- "${package_json_path}")"

              missing_release_tags=1
              missing_release_tag_args+=("refs/tags/${release_tag}")
              missing_release_tag_targets+=("${release_tag}:${release_commit}")
              echo "Missing release tag ${release_tag}"
            fi
          done <<< "${release_packages}"

          if [ "${missing_release_tags}" -eq 0 ]; then
            echo "All release tags already exist. Nothing to do."
            exit 0
          fi

          for tag_target in "${missing_release_tag_targets[@]}"; do
            release_tag="${tag_target%%:*}"
            release_commit="${tag_target#*:}"

            if [ -z "${release_commit}" ]; then
              echo "Could not determine the release commit for ${release_tag}" >&2
              exit 1
            fi

            git tag "${release_tag}" "${release_commit}"
          done

          git push origin "${missing_release_tag_args[@]}"
