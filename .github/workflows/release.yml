name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update release branch or tags
        run: |
          if find .changeset -maxdepth 1 -name "*.md" ! -name "README.md" -print -quit | grep -q .; then
            if git fetch origin changeset-release/main:refs/remotes/origin/changeset-release/main 2>/dev/null; then
              release_branch_sha="$(git rev-parse refs/remotes/origin/changeset-release/main)"
            else
              release_branch_sha=""
            fi

            git checkout -B changeset-release/main "${GITHUB_SHA}"

            npm run version

            if git diff --quiet; then
              echo "No release changes to commit."

              if [ -n "${release_branch_sha}" ]; then
                git push origin HEAD:changeset-release/main --force-with-lease=changeset-release/main:"${release_branch_sha}"
              else
                git push origin HEAD:changeset-release/main
              fi

              exit 0
            fi

            git add .
            git commit -m "chore: version skills"

            if [ -n "${release_branch_sha}" ]; then
              git push origin HEAD:changeset-release/main --force-with-lease=changeset-release/main:"${release_branch_sha}"
            else
              git push origin HEAD:changeset-release/main
            fi

            echo "Updated changeset-release/main. Open or update the release PR manually."
            exit 0
          fi

          release_tags="$(node ./scripts/plan-release-tags.mjs)"

          if [ -z "${release_tags}" ]; then
            echo "All release tags already exist. Nothing to do."
            exit 0
          fi

          while IFS=$'\t' read -r release_tag release_commit; do
            echo "Missing release tag ${release_tag}"

            if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "Release tag ${release_tag} already exists. Skipping."
              continue
            fi

            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
              git tag -d "${release_tag}"
            fi

            git tag "${release_tag}" "${release_commit}"
            git push origin "refs/tags/${release_tag}"
          done <<< "${release_tags}"
